# Strapi needs a FLAT node_modules — its admin is served by Vite in dev, and Vite's
# CJS interop mishandles exports-map-less packages reached only through pnpm's
# isolated .pnpm tree.
nodeLinker: hoisted

packages:
  - '.'

# Allow day-0 @strapi/* npm publishes while keeping pnpm 11 supply-chain defaults for other deps.
minimumReleaseAgeExclude:
  - '@strapi/*'

allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  sharp: true
