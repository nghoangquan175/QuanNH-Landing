<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Same mark as components/ui/Logo.tsx on a rounded tile. A favicon cannot see the
       site's theme toggle, so it follows the OS colour scheme instead. -->
  <style>
    .bg { fill: #07080b; }
    .letter { stroke: #e9ecf3; }
    .step { stroke: #7cf5c4; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #fbfaff; }
      .letter { stroke: #16142b; }
      .step { stroke: #6d5dfc; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="8" />
  <g transform="translate(16 16) scale(0.78) translate(-17 -17)" stroke-width="3.6" stroke-linecap="square">
    <path class="letter" d="M20 13a7 7 0 1 0-7 7h7V6" />
    <path class="step" d="M20 20v4h4v4h4" />
  </g>
</svg>
