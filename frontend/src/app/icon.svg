<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Same mark as components/ui/Logo.tsx. A favicon cannot see the site's theme toggle,
       so it follows the OS colour scheme instead. -->
  <style>
    .bg { fill: #07080b; }
    .frame { stroke: #e9ecf3; }
    .step { stroke: #7cf5c4; }
    .dot { fill: #7cf5c4; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #fbfaff; }
      .frame { stroke: #16142b; }
      .step { stroke: #6d5dfc; }
      .dot { fill: #6d5dfc; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="32" height="32" rx="9" />
  <rect class="frame" x="3.5" y="3.5" width="25" height="25" rx="7" stroke-width="2" />
  <path class="step" d="M9 23h4.5v-4.5h4.5v-4.5h4.5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <circle class="dot" cx="22.5" cy="9.5" r="2" />
</svg>
