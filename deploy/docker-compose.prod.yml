# Production stack on EC2 — copied to /opt/portfolio/docker-compose.yml by the deploy
# workflow, which also writes TAG (the commit being deployed) to /opt/portfolio/.env.
#
# Images are built by GitHub Actions and pulled from GHCR; the server never builds.
# Secrets live next to this file in backend.env / frontend.env (mode 600), never in git.
# Both apps bind to 127.0.0.1 only — Nginx on the host terminates TLS in front of them.
services:
  backend:
    image: ghcr.io/nghoangquan175/portfolio-backend:${TAG:-latest}
    container_name: portfolio-backend
    restart: unless-stopped
    env_file: ./backend.env
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      # SQLite database and uploaded media survive image updates.
      - portfolio-db:/app/.tmp
      - portfolio-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: ghcr.io/nghoangquan175/portfolio-frontend:${TAG:-latest}
    container_name: portfolio-frontend
    restart: unless-stopped
    env_file: ./frontend.env
    environment:
      # Server-side CMS calls go container-to-container, not out through Cloudflare.
      STRAPI_API_URL: http://backend:1337
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  portfolio-db:
  portfolio-uploads:
